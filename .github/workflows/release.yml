name: release

# Cut a release by pushing a tag:  git tag v0.1.3 && git push origin v0.1.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bunx tsgo --noEmit && bunx oxlint && bun test

  # Each binary is built on a runner of its OWN platform, because @resvg/resvg-js
  # is a per-platform native addon that bun --compile can only embed when that
  # platform's prebuilt is installed. Each job smoke-tests `share` (which loads
  # resvg) so a broken binary fails here instead of shipping.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: clocked-in-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: clocked-in-linux-arm64
          - os: macos-13
            target: bun-darwin-x64
            asset: clocked-in-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
            asset: clocked-in-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile

      - name: Build ${{ matrix.asset }}
        env:
          CLOCKED_IN_VERSION: ${{ github.ref_name }}
          CLOCKED_IN_COMMIT: ${{ github.sha }}
          CLOCKED_IN_TARGET: ${{ matrix.target }}
          CLOCKED_IN_ASSET: ${{ matrix.asset }}
        run: bun run build:release

      - name: Smoke test (loads native resvg via `share`)
        run: |
          bin="dist/release/${{ matrix.asset }}"
          chmod +x "$bin"
          db="$RUNNER_TEMP/smoke.db"
          "$bin" version
          echo '{"session_id":"smoke"}' | "$bin" hook start --agent claude-code
          echo '{"session_id":"smoke"}' | "$bin" hook stop --agent claude-code
          CLOCKED_IN_DB="$db" "$bin" hook start --agent claude-code < /dev/null
          CLOCKED_IN_DB="$db" "$bin" hook stop --agent claude-code < /dev/null
          CLOCKED_IN_DB="$db" "$bin" share --no-open --out "$RUNNER_TEMP/card.png"
          test -s "$RUNNER_TEMP/card.png" || { echo "share produced no PNG"; exit 1; }
          echo "OK: $bin runs and renders a card"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum clocked-in-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/clocked-in-* \
            artifacts/SHA256SUMS \
            install.sh \
            --title "${{ github.ref_name }}" \
            --generate-notes
